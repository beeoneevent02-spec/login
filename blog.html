    <section class="ftco-section bg-light">
      <div class="container">
        <div class="row justify-content-center mb-3">
          <div class="col-md-8 text-center ftco-animate">
            <h2 class="mb-4"><span>Recent</span> Blog</h2>
          </div>
        </div>
        <div id="blog-posts" class="row d-flex"></div>
        <div id="blog-empty" class="row d-flex" style="display:none;"><div class="col-md-12"><div class="alert alert-info text-center">No blog posts are published yet. Add posts from admin.</div></div></div>
      </div>
    </section>
    <script>
      (function(){
        function safeParse(){
          try{ var raw = localStorage.getItem('eventalk_blogs'); var data = raw ? JSON.parse(raw) : []; return Array.isArray(data) ? data : []; } catch(e){ return []; }
        }
        function escapeHtml(str){ return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
        function formatDate(date){ if(!date) return ''; var parts = date.split('-'); return parts.length===3 ? parts[2] + ' ' + parts[1] + ' ' + parts[0] : date; }
        function renderPosts(){ var posts = safeParse(); var container = document.getElementById('blog-posts'); var empty = document.getElementById('blog-empty'); if(!container) return;
          if(posts.length === 0){ container.innerHTML=''; if(empty) empty.style.display='flex'; return; }
          if(empty) empty.style.display='none';
          var html = '';
          posts.slice().reverse().forEach(function(post){ html += '<div class="col-md-4 d-flex ftco-animate">'
            + '<div class="blog-entry justify-content-end">'
            + '<a href="blog-single.html?id=' + encodeURIComponent(post.id||'') + '" class="block-20" style="background-image: url(' + (post.image ? '"'+ escapeHtml(post.image) +'"' : 'images/image_1.jpg') + ');"></a>'
            + '<div class="text p-4 float-right d-block">'
            + '<div class="d-flex align-items-center pt-2 mb-4">'
            + '<div class="one"><span class="day">' + escapeHtml(post.date ? post.date.split('-')[2] : '') + '</span></div>'
            + '<div class="two"><span class="yr">' + escapeHtml(post.date ? post.date.split('-')[0] : '') + '</span><span class="mos">' + escapeHtml(post.category || '') + '</span></div>'
            + '</div>'
            + '<h3 class="heading mt-2"><a href="blog-single.html?id=' + encodeURIComponent(post.id||'') + '">' + escapeHtml(post.title) + '</a></h3>'
            + '<p>' + escapeHtml(post.excerpt) + '</p>'
            + '</div></div></div>';
          });
          container.innerHTML = html;
        }
        (function(handler){
          function runIfReady(){
            var domReady = document.readyState === 'interactive' || document.readyState === 'complete';
            var hydrated = !!window._localstorageHydrated;
            if(domReady && hydrated){ handler(); return; }
            function domHandler(){ domReady = true; if(hydrated){ cleanup(); handler(); } }
            function hydHandler(){ hydrated = true; if(domReady){ cleanup(); handler(); } }
            function cleanup(){ document.removeEventListener('DOMContentLoaded', domHandler); window.removeEventListener('localstorage-hydrated', hydHandler); }
            document.addEventListener('DOMContentLoaded', domHandler);
            window.addEventListener('localstorage-hydrated', hydHandler);
          }
          runIfReady();
        })(renderPosts);
        window.addEventListener('storage', renderPosts);
      })();
    </script>
