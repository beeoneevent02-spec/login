<html lang="en">

    <style>
      :root { --gold: #f2bd4c; --blue: #08142d; --panel: rgba(15,29,58,.88); --soft: #b9c8e0; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; overflow: hidden; background: radial-gradient(circle at 50% -20%, #294d85, transparent 42%), linear-gradient(135deg,#050b1b,#0b1730 55%,#050a18); color: #fff; font-family: "Work Sans", sans-serif; }
      body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .18; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px); background-size: 56px 56px; mask-image: linear-gradient(to bottom, black, transparent 75%); }
      .tv-shell { position: relative; min-height: 100vh; padding: clamp(24px, 4vw, 64px); display: flex; flex-direction: column; }
      .tv-topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; color: var(--soft); letter-spacing: .14em; text-transform: uppercase; font-size: clamp(.7rem, 1vw, .9rem); }

      .tv-clock { white-space: nowrap; }

        .slide { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; padding: clamp(24px, 5vw, 76px); border: 0; border-radius: 0; background: transparent; box-shadow: none; animation: slide-in .65s cubic-bezier(.22,.61,.36,1) both; overflow: hidden; }
      .results-slide { justify-content: flex-start; padding-top: clamp(28px, 4vh, 48px); }
      .slide::after { content: ''; position: absolute; width: 420px; height: 420px; top: -260px; right: -80px; border-radius: 50%; background: rgba(145,194,247,.12); filter: blur(2px); pointer-events: none; }
      .slide.active { display: flex; opacity: 1; animation: slide-in .65s cubic-bezier(.22,.61,.36,1) both; }
      .slide.active .slide-kicker { animation: reveal-up .55s .08s cubic-bezier(.22,.61,.36,1) both; }

      .slide.active .slide-subtitle { animation: reveal-up .55s .28s cubic-bezier(.22,.61,.36,1) both; }
      .slide-kicker { color: var(--gold); font-size: clamp(.8rem, 1.3vw, 1.1rem); font-weight: 800; letter-spacing: .24em; text-transform: uppercase; margin-bottom: 18px; }
      .slide-title { position: relative; z-index: 1; margin: 0 0 12px; color: #fff; font-size: clamp(2.2rem, 6vw, 6.4rem); line-height: .98; font-weight: 900; letter-spacing: -.04em; text-shadow: 0 5px 22px rgba(0,0,0,.32); }
      .slide-subtitle { max-width: 760px; color: var(--soft); font-size: clamp(1rem, 1.8vw, 1.5rem); }

      .event-slide::before { content: '✦'; position: absolute; left: 50%; top: 24%; color: rgba(242,189,76,.13); font-size: clamp(7rem,20vw,18rem); line-height: 1; transform: translate(-50%,-50%); }

      .event-meta span { padding: 13px 20px; border: 1px solid rgba(242,189,76,.35); border-radius: 999px; background: linear-gradient(135deg,rgba(242,189,76,.18),rgba(242,189,76,.04)); color: #fff1c8; font-size: clamp(.9rem, 1.3vw, 1.1rem); box-shadow: 0 10px 24px rgba(0,0,0,.15); }

      .graph-bar { height: 100%; border-radius: inherit; background: linear-gradient(90deg,#fff0a9 0%,#f0bd46 42%,#a9670a 100%); box-shadow: 0 0 16px rgba(242,189,76,.34); animation: grow .9s cubic-bezier(.22,.61,.36,1) both; transform-origin: left; }

      .podium { display: grid; grid-template-columns: 1fr 1.16fr 1fr; align-items: end; gap: 14px; width: min(1060px, 100%); margin: clamp(12px, 2vh, 22px) auto clamp(16px, 2vh, 24px); }
      .podium-card { position: relative; display: flex; min-height: clamp(118px, 16vh, 150px); flex-direction: column; align-items: center; justify-content: flex-end; padding: 12px 10px 15px; border: 1px solid rgba(255,255,255,.28); border-radius: 16px 16px 10px 10px; color: #fff; overflow: hidden; box-shadow: 0 16px 26px rgba(27,48,55,.2), inset 0 1px rgba(255,255,255,.34); }
      .podium-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(145deg, rgba(255,255,255,.3), transparent 34%, rgba(0,0,0,.12)); pointer-events: none; }
      .group-slide.active .podium-card { animation: podium-in .65s cubic-bezier(.22,.61,.36,1) both; }

      .trophy-bronze .award-ribbon { background: linear-gradient(110deg, #55e755, #14a82f 60%, #08751d); }
      .trophy-bronze .award-coin { background: radial-gradient(circle at 35% 28%, #ffcd93 0 8%, #e66d2c 9% 34%, #a8411f 35% 55%, #f0803a 56% 70%, #943117 71%); }
      .place-label, .podium-team, .podium-points { position: relative; z-index: 1; text-align: center; text-shadow: 0 2px 3px rgba(0,0,0,.2); }
      .place-label { font-size: .78rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
      .podium-team { width: 100%; margin: 8px 0 4px; font-size: clamp(.95rem, 1.8vw, 1.4rem); font-weight: 900; overflow-wrap: anywhere; }
      .podium-points { font-size: .92rem; font-weight: 800; }
      .group-slide .graph-grid { max-width: 1060px; margin-top: 0; max-height: calc(100vh - 390px); overflow: hidden; }
      .group-slide .graph-row { margin: clamp(7px, 1.2vh, 12px) 0; }
      .group-slide.active .graph-row { animation: reveal-up .5s cubic-bezier(.22,.61,.36,1) both; }
      .group-slide.active .graph-row:nth-child(1) { animation-delay: .65s; }
      .group-slide.active .graph-row:nth-child(2) { animation-delay: .73s; }
      .group-slide.active .graph-row:nth-child(3) { animation-delay: .81s; }
      .group-slide.active .graph-row:nth-child(4) { animation-delay: .89s; }
      .group-slide.active .graph-row:nth-child(5) { animation-delay: .97s; }
      .group-slide.active .graph-row:nth-child(6) { animation-delay: 1.05s; }
      .slide.active:not(.group-slide) .graph-row { animation: reveal-up .5s cubic-bezier(.22,.61,.36,1) both; }
      .slide.active:not(.group-slide) .graph-row:nth-child(1) { animation-delay: .42s; }
      .slide.active:not(.group-slide) .graph-row:nth-child(2) { animation-delay: .5s; }
      .slide.active:not(.group-slide) .graph-row:nth-child(3) { animation-delay: .58s; }
      .slide.active:not(.group-slide) .graph-row:nth-child(4) { animation-delay: .66s; }
      .slide.active:not(.group-slide) .graph-row:nth-child(5) { animation-delay: .74s; }

      .result-card { min-height: 190px; padding: 20px; border: 1px solid rgba(147,184,229,.25); border-radius: 16px; background: linear-gradient(145deg,rgba(39,68,117,.76),rgba(8,21,47,.92)); box-shadow: 0 16px 35px rgba(0,0,0,.25), inset 0 1px rgba(255,255,255,.08); }
      .results-slide .slide-title { font-size: clamp(2.2rem, 5vw, 5.2rem); }
      .results-slide .result-grid { margin-top: 20px; }
      .results-slide .result-card { min-height: 0; padding: 16px; }
      .results-slide .result-program { min-height: 38px; margin: 10px 0; }
      .result-number { color: var(--gold); font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      .result-program { min-height: 48px; margin: 12px 0; font-size: 1.05rem; font-weight: 800; }
      .result-winner { color: var(--soft); font-size: .9rem; line-height: 1.55; }
      .poster-slide { align-items: center; justify-content: flex-start; padding: clamp(22px, 3vh, 38px) clamp(28px, 5vw, 76px); }
      .poster-slide .slide-kicker, .poster-slide .slide-title, .poster-slide .slide-subtitle { text-align: center; }
      .poster-slide .slide-title { max-width: 92%; font-family: "Noto Sans Malayalam", "Work Sans", sans-serif; font-size: clamp(1.8rem, 4vw, 4.2rem); line-height: 1.12; letter-spacing: 0; overflow-wrap: anywhere; }
      .poster-slide .slide-subtitle { margin-bottom: 0; }
      .poster-layout { display: grid; grid-template-columns: minmax(220px, .78fr) minmax(440px, 1.5fr); align-items: center; gap: clamp(20px, 3.5vw, 48px); width: min(1080px, 100%); margin-top: clamp(14px, 2vh, 24px); }
      .poster-program { position: relative; min-height: 160px; display: flex; flex-direction: column; justify-content: center; padding: 24px; border-radius: 22px; background: linear-gradient(135deg,#0088ff 0%,#4dd0e1 100%); box-shadow: 0 16px 40px rgba(0,136,255,.34); overflow: hidden; }
      .poster-program::after { content: ''; position: absolute; right: -50px; bottom: -70px; width: 220px; height: 220px; border-radius: 50%; background: rgba(0,0,0,.12); }
      .poster-category { position: relative; z-index: 1; margin-bottom: 10px; color: rgba(255,255,255,.9); font-size: .85rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      .poster-program-name { position: relative; z-index: 1; color: #fff; font-family: "Noto Sans Malayalam", "Work Sans", sans-serif; font-size: clamp(1.55rem, 3vw, 3.1rem); font-weight: 900; line-height: 1.12; overflow-wrap: anywhere; text-shadow: 0 5px 16px rgba(0,0,0,.2); }
      .poster-winners { display: flex; flex-direction: column; gap: 7px; }
      .poster-winner { display: grid; grid-template-columns: 58px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 13px; background: rgba(255,255,255,.96); color: #18202b; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
      .poster-slide.active .poster-program { animation: reveal-up .65s .3s cubic-bezier(.22,.61,.36,1) both; }
      .poster-slide.active .poster-winner { animation: reveal-up .55s cubic-bezier(.22,.61,.36,1) both; }
      .poster-slide.active .poster-winner:nth-child(1) { animation-delay: .46s; }
      .poster-slide.active .poster-winner:nth-child(2) { animation-delay: .56s; }
      .poster-slide.active .poster-winner:nth-child(3) { animation-delay: .66s; }
      .poster-rank { display: grid; place-items: center; width: 52px; height: 42px; border-radius: 10px; font-size: .75rem; font-weight: 900; text-transform: uppercase; }
      .poster-rank i { font-size: 1.35rem; line-height: 1; }
      .poster-winner.first .poster-rank { background: linear-gradient(135deg,#ffba50,#ff8a00); }
      .poster-winner.second .poster-rank { background: linear-gradient(135deg,#b9c6d2,#718191); color: #fff; }
      .poster-winner.third .poster-rank { background: linear-gradient(135deg,#dfa37e,#9c4d2d); color: #fff; }
      .poster-winner-name { font-size: clamp(.9rem, 1.5vw, 1.15rem); font-weight: 900; overflow-wrap: anywhere; }
      .poster-winner-team { margin-top: 2px; color: #718096; font-size: .8rem; font-weight: 700; overflow-wrap: anywhere; }
      .poster-winner-score { color: #172d51; font-size: .95rem; font-weight: 900; white-space: nowrap; }
      .tv-footer { display: flex; justify-content: space-between; align-items: center; color: rgba(185,200,224,.65); font-size: .85rem; }
      #slide-status::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: #54df9a; box-shadow: 0 0 12px rgba(84,223,154,.7); }
      .tv-controls button { margin-left: 8px; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; background: rgba(255,255,255,.07); color: #fff; padding: 8px 12px; cursor: pointer; }
      .empty { color: var(--soft); font-size: 1.2rem; }
      @keyframes slide-in { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes reveal-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes podium-in { from { opacity: 0; transform: translateY(28px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
      @media (max-width: 800px) { body { overflow: auto; } .tv-shell { min-height: 100vh; } #slide-stage { flex: none; min-height: 620px; } .result-grid { grid-template-columns: 1fr; max-height: 62vh; overflow: auto; } .result-card { min-height: 0; } .graph-row { grid-template-columns: 88px 1fr 45px; gap: 9px; } .group-slide { padding-top: 28px; } .group-slide .podium { gap: 7px; margin-bottom: 20px; } .group-slide .podium-card { min-height: 125px; padding: 12px 6px 15px; } .group-slide .podium-card.first { min-height: 155px; } .group-slide .trophy { transform: scale(.55); margin-bottom: 2px; } .group-slide .place-label { font-size: .6rem; letter-spacing: .08em; } .group-slide .podium-team { font-size: .82rem; margin: 5px 0 2px; } .group-slide .podium-points { font-size: .72rem; } .poster-slide { padding-top: 28px; } .poster-layout { grid-template-columns: 1fr; gap: 18px; margin-top: 22px; } .poster-program { min-height: 140px; padding: 24px; } .poster-winners { gap: 10px; } .poster-winner { grid-template-columns: 58px minmax(0,1fr); gap: 10px; padding: 12px; } .poster-rank { width: 54px; height: 48px; font-size: .75rem; } .poster-winner-score { grid-column: 2; font-size: .95rem; } .tv-footer { margin-top: 18px; } }
    </style>

  <body>
    <main class="tv-shell">
      <header class="tv-topbar"><div class="tv-brand"><img class="tv-logo" id="tv-logo" alt="Event logo"></div><div class="tv-clock" id="tv-clock"></div></header>
      <section id="slide-stage" aria-live="polite"></section>
      <footer class="tv-footer"><span id="slide-status">Loading display...</span><div class="tv-controls"><button type="button" id="pause-btn"><i class="fa fa-pause"></i> Pause</button><button type="button" id="next-btn"><i class="fa fa-forward"></i> Next</button></div></footer>
    </main>
    <script>
      (function(){
        var stage = document.getElementById('slide-stage');
        var status = document.getElementById('slide-status');
        var slides = [];
        var current = 0;
        var paused = false;
        var timer = null;
        function parse(key, fallback){ try { var raw=localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch(e) { return fallback; } }
        function escapeHtml(value){ return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
        function applyBranding(event){ var logo=document.getElementById('tv-logo'); if(logo){ if(event.programLogo){ logo.src=event.programLogo; logo.style.display='block'; } else { logo.removeAttribute('src'); logo.style.display='none'; } } }
        function participants(){ var list=parse('eventalk_participants',[]); var map={}; list.forEach(function(p){ if(p && p.chest) map[String(p.chest)]=p; }); return map; }
        function groupPoints(){ return parse('eventalk_team_points',[]).map(function(x){ return {name:x.teamName||x.team||'Unknown',points:parseInt(x.points,10)||0}; }).sort(function(a,b){ return b.points-a.points; }); }
        function individualPoints(){ var totals={}, map=participants(), finals=parse('eventalk_final_results',{}); Object.keys(finals).forEach(function(key){ var rows=finals[key]||[]; rows.map(function(row){ return {chest:row.chest,total:(parseFloat(row.j1)||0)+(parseFloat(row.j2)||0)+(parseFloat(row.j3)||0)}; }).sort(function(a,b){ return b.total-a.total; }).forEach(function(row,index){ var points=index===0?5:index===1?3:index===2?1:0; if(points){ var name=(map[String(row.chest)]||{}).name||('Chest '+row.chest); totals[name]=(totals[name]||0)+points; } }); }); return Object.keys(totals).map(function(name){ return {name:name,points:totals[name]}; }).sort(function(a,b){ return b.points-a.points; }); }
        function graphSlide(title, rows, mode){ var isTeamPodium=mode==='Team standings'; var html='<article class="slide '+(isTeamPodium?'group-slide':'')+'"><div class="slide-kicker">Live standings</div><h1 class="slide-title">'+title+'</h1><p class="slide-subtitle">Points leaderboard · '+mode+'</p>'; if(isTeamPodium){ var places=[{label:'2nd place',className:'second',award:'trophy-medal',index:1},{label:'1st place',className:'first',award:'trophy-cup',index:0},{label:'3rd place',className:'third',award:'trophy-medal trophy-bronze',index:2}]; html+='<div class="podium">'; places.forEach(function(place){ var row=rows[place.index]; var award=place.award==='trophy-cup'?'<span class="award-handle left"></span><span class="award-handle right"></span><span class="award-bowl"></span><span class="award-stem"></span><span class="award-base"></span>':'<span class="award-ribbon"></span><span class="award-coin"></span>'; html+='<div class="podium-card '+place.className+'"><div class="trophy '+place.award+'" aria-hidden="true">'+award+'</div><div class="place-label">'+place.label+'</div><div class="podium-team">'+escapeHtml(row?row.name:'Awaiting team')+'</div>'+(row?'<div class="podium-points">'+row.points+' points</div>':'')+'</div>'; }); html+='</div>'; return html+'</article>'; } html+='<div class="graph-grid">'; if(!rows.length) html+='<div class="empty">No points data available yet.</div>'; var max=Math.max(rows.length?rows[0].points:1,1); rows.forEach(function(row){ html+='<div class="graph-row"><div class="graph-name">'+escapeHtml(row.name)+'</div><div class="graph-track"><div class="graph-bar" style="width:'+Math.max(row.points/max*100,2)+'%"></div></div><div class="graph-value">'+row.points+'</div></div>'; }); return html+'</div></article>'; }
        function latestResults(){ var finals=parse('eventalk_final_results',{}), map=participants(), list=Object.keys(finals).map(function(key){ var split=key.split('||'); var rows=finals[key]||[], sorted=rows.map(function(row){ return {name:(map[String(row.chest)]||{}).name||('Chest '+row.chest),team:(map[String(row.chest)]||{}).team||'',total:(parseFloat(row.j1)||0)+(parseFloat(row.j2)||0)+(parseFloat(row.j3)||0)}; }).sort(function(a,b){ return b.total-a.total || String(a.name).localeCompare(String(b.name)); }); return {program:split[1]||split[0]||'Finalized result',category:split[0]||'',winners:sorted.slice(0,3)}; }).slice(-5).reverse(); return list; }
        function posterSlide(item,index){ var ranks=['first','second','third'], labels=['1st place','2nd place','3rd place'], icons=['fa-trophy','fa-medal','fa-medal']; var winners=item.winners.map(function(winner,rank){ return '<div class="poster-winner '+ranks[rank]+'"><div class="poster-rank" title="'+labels[rank]+'" aria-label="'+labels[rank]+'"><i class="fas '+icons[rank]+'" aria-hidden="true"></i></div><div><div class="poster-winner-name">'+escapeHtml(winner.name)+'</div><div class="poster-winner-team">'+(winner.team?escapeHtml(winner.team)+' · ':'')+'Chest '+escapeHtml(winner.chest)+'</div></div><div class="poster-winner-score">'+winner.total+' marks</div></div>'; }).join(''); if(!winners) winners='<div class="empty">No ranked participants available.</div>'; return '<article class="slide poster-slide"><div class="slide-kicker">Competition result '+(index+1)+'</div><p class="slide-subtitle">'+escapeHtml(item.category||'Finalized program')+' · Top three places</p><div class="poster-layout"><div class="poster-program"><div class="poster-category">Finalized program</div><div class="poster-program-name">'+escapeHtml(item.program)+'</div></div><div class="poster-winners">'+winners+'</div></div></article>'; }
        function build(){ var event=parse('eventalk_event_title',{}), finals=latestResults(), teams=groupPoints(); applyBranding(event); slides=[]; slides.push('<article class="slide event-slide"><div class="slide-kicker">Event presentation</div><h1 class="slide-title">'+escapeHtml(event.programName||'Team Points')+'</h1><p class="slide-subtitle">'+escapeHtml(event.programPlaceDate||'Live event results and team standings')+'</p><div class="event-meta"><span><i class="fa fa-trophy"></i> Live results display</span><span><i class="fa fa-chart-bar"></i> Updated automatically</span></div></article>'); slides.push(graphSlide('Group points',teams,'Team standings')); slides.push(graphSlide('Team points leaderboard',teams,'Team leaderboard')); slides.push(graphSlide('Individual points',individualPoints(),'Participant standings')); if(finals.length){ finals.forEach(function(item,index){ slides.push(posterSlide(item,index)); }); } else { slides.push('<article class="slide poster-slide"><div class="slide-kicker">Competition recap</div><h1 class="slide-title">Latest finalized results</h1><p class="slide-subtitle">No finalized programs available yet.</p></article>'); } stage.innerHTML=slides.join(''); slides=Array.prototype.slice.call(stage.querySelectorAll('.slide')); show(0); }
        function show(index){ if(!slides.length) return; slides[current].classList.remove('active'); current=(index+slides.length)%slides.length; slides[current].classList.add('active'); status.textContent='Slide '+(current+1)+' of '+slides.length+' · TV public display'; }
        function next(){ show(current+1); if(!paused) schedule(); }
        function schedule(){ clearTimeout(timer); timer=setTimeout(next, current===0?7000:6000); }
        document.getElementById('next-btn').addEventListener('click',function(){ next(); });
        document.getElementById('pause-btn').addEventListener('click',function(){ paused=!paused; this.innerHTML=paused?'<i class="fa fa-play"></i> Play':'<i class="fa fa-pause"></i> Pause'; if(paused) clearTimeout(timer); else schedule(); });
        function clock(){ document.getElementById('tv-clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); } setInterval(clock,1000); clock(); build(); window.addEventListener('storage',build); window.addEventListener('localstorage-remote-change',build); window.addEventListener('localstorage-hydrated',build); schedule();
      })();
    </script>
